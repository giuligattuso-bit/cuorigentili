name: Pubblica lámine e regali programmati

# Ogni sabato pubblica sul sito la lámina programmata (ES, EN, IT) poco prima
# del post sui social delle 10:30. Le lámine future restano nel ramo
# `programmati` e non sono online finché non arriva la loro data.
# Controlla ogni 10 minuti: ogni contenuto ha la sua ora di uscita (ora di Madrid)
# nel manifest, di solito una ventina di minuti prima del post sui social.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-laminas
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prendi le lámine programmate
        run: |
          git fetch --depth 1 origin programmati
          mkdir -p /tmp/programmati
          git archive FETCH_HEAD laminas | tar -x -C /tmp/programmati

      - name: Pubblica quelle arrivate alla data
        id: pubblica
        run: python3 scripts/pubblica_lamina.py /tmp/programmati/laminas

      - name: Salva e pubblica il sito
        if: steps.pubblica.outputs.published != ''
        run: |
          git config user.name "cuorigentili-bot"
          git config user.email "giuligattuso-bit@users.noreply.github.com"
          git add -A descargas en it
          git commit -m "Lámina del sabato: ${{ steps.pubblica.outputs.published }}"
          git push origin HEAD:main
